name: CI

# Verifies the website on every pull request and on pushes to main.
# The deploy workflow re-runs these same checks before publishing, so a
# broken commit cannot reach GitHub Pages even if it lands on main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Colour is checked before anything is built, because a contrast
      # regression is a defect in the tokens rather than in the site, and the
      # site cannot be right if the tokens are wrong. Three shipped bugs —
      # a hero heading at 2.79:1, bullet dots below 1.4.11's 3:1, and a 1.0:1
      # "elevation" step — would each have been caught here on the day they
      # were written. Needs no dependencies; it is stdlib Python.
      - name: Contrast audit
        working-directory: .
        run: python3 brand/tokens/check_contrast.py

      # tokens.css is GENERATED from tokens.json. Editing it by hand, or
      # editing tokens.json and forgetting to re-run the build, silently
      # decouples the site from its source of truth — so regenerate and fail
      # if anything moved.
      - name: Tokens are in sync with tokens.json
        working-directory: .
        run: |
          python3 brand/tokens/build_css.py
          git diff --exit-code -- brand/tokens/tokens.css web/src/app/tokens.css \
            || { echo "::error::tokens.css is stale — run brand/tokens/build_css.py and commit"; exit 1; }

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tailwind.config.ts REPLACES theme.spacing with the token scale, so an
      # off-scale utility produces no CSS rather than an off-grid value. That
      # failure is silent — a class that does nothing looks exactly like a class
      # that was never needed — so it is asserted here instead.
      - name: Spacing scale
        run: node scripts/check-spacing.mjs

      # Page titles and descriptions have a length budget and have to stay
      # distinct across sixteen strings in two languages. Three descriptions had
      # already drifted over it before this was asserted.
      - name: Page metadata budget
        run: npm run check:meta

      # The copy sits in slots the layout does not let it overflow — the mono
      # eyebrows, the price notes, the one-line "for whom" strings. A copy edit
      # that breaks 375px should fail here rather than on a phone.
      - name: Copy fits its slots
        run: npm run check:copy

      # The crossroads render pipeline cannot read a CSS custom property, so
      # palette.ts carries sixteen hex literals instead, for
      # check-scene-palette.mjs and for tools/blender/crossroads.py's own copy
      # to be checked by eye against. This is the only thing that keeps
      # palette.ts honest, and drift there is invisible on screen: a render
      # painted in slightly wrong greens still looks like a render. Without
      # this step the literals are simply a second, unchecked copy of the
      # tokens.
      - name: Scene palette matches the tokens
        run: npm run check:palette

      - name: Format check
        run: npm run format:check

      # lib/routes.ts decides every URL on the site, localised slugs and all,
      # and had no test until now.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # The site's pitch is that it loads fast. The homepage's services
      # section used to be the first thing on it heavy enough to make that
      # untrue by accident, a three.js scene fetched in its own chunk; it is
      # five pre-rendered stills now, so this guards two narrower things
      # instead: that the eager page script does not creep past its baseline,
      # and that three.js does not quietly come back in a built chunk.
      - name: JavaScript budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The repo had no browser tests until the crossroads section, whose
      # worst failure modes (a sticky stage painting over the section below, a
      # pinned track that never releases at its last stop, a label overlapping
      # another) are invisible to a typecheck and to every check-*.mjs script.
      #
      # In the stills world only. This runner has no graphics card and draws
      # WebGL through SwiftShader on two cores, and on 3 September that was
      # about three seconds a frame at 1440x900: every test about the live
      # scene ran out its waits with four or five frames drawn, while the same
      # suite passed on a laptop in five minutes. CROSSROADS_WORLD=stills
      # refuses WebGL to every page and skips those tests, so what runs here
      # is the section's shell (the pin, the track, the ride, the rows, the
      # names) over the five renders, and the live scene is gated on a machine
      # that can draw it, with a plain `npm run test:e2e` before a merge.
      - name: Browser tests
        run: npm run test:e2e
        env:
          CROSSROADS_WORLD: stills

      # The site is served from a subpath on GitHub Pages, which is where
      # static exports usually break — and the breakage is invisible in a
      # domain-root build. Building that way here means a bad base path fails
      # the pull request rather than the deployment.
      - name: Build with a base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /basepath-check
          NEXT_PUBLIC_SITE_URL: https://example.com/basepath-check

      - name: Assert the base path reached the output
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          grep -q 'href="/basepath-check/de/"' out/de/index.html \
            || fail "basePath missing from rendered links"
          grep -q 'href="/basepath-check/favicon.svg"' out/de/index.html \
            || fail "basePath missing from icon URLs"
          grep -q 'href="https://example.com/basepath-check/de/"' out/de/index.html \
            || fail "canonical URL is wrong"
          grep -q 'basepath-check/basepath-check' out/de/index.html \
            && fail "base path applied twice"
          echo "base path wiring verified"

      # JSON-LD @ids are absolute and built from profile.siteUrl, which already
      # contains the subpath — so they must NOT also go through asset(). That
      # mistake is invisible at a domain root and poisons every @id on a subpath
      # deploy, which is exactly the failure mode this build reproduces.
      - name: Assert the structured data is addressed correctly
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          grep -q '"@id":"https://example.com/basepath-check/#business"' out/de/index.html \
            || fail "JSON-LD @id is not the production origin"
          grep -q '"item":"https://example.com/basepath-check/de/leistungen/"' \
            out/de/leistungen/index.html \
            || fail "breadcrumb item URL is wrong on a subpath build"
          grep -q 'basepath-check/basepath-check' out/de/leistungen/index.html \
            && fail "base path applied twice inside the structured data"
          [ "$(grep -c 'application/ld+json' out/de/index.html)" = 1 ] \
            || fail "expected exactly one JSON-LD block per page"
          grep -q 'application/ld+json' out/de/impressum/index.html \
            && fail "legal pages are noindex and should carry no structured data"
          echo "structured data wiring verified"
