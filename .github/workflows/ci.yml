name: CI

# Verifies the website on every pull request and on pushes to main.
# The deploy workflow re-runs these same checks before publishing, so a
# broken commit cannot reach GitHub Pages even if it lands on main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Colour is checked before anything is built, because a contrast
      # regression is a defect in the tokens rather than in the site, and the
      # site cannot be right if the tokens are wrong. Three shipped bugs —
      # a hero heading at 2.79:1, bullet dots below 1.4.11's 3:1, and a 1.0:1
      # "elevation" step — would each have been caught here on the day they
      # were written. Needs no dependencies; it is stdlib Python.
      - name: Contrast audit
        working-directory: .
        run: python3 brand/tokens/check_contrast.py

      # tokens.css is GENERATED from tokens.json. Editing it by hand, or
      # editing tokens.json and forgetting to re-run the build, silently
      # decouples the site from its source of truth — so regenerate and fail
      # if anything moved.
      - name: Tokens are in sync with tokens.json
        working-directory: .
        run: |
          python3 brand/tokens/build_css.py
          git diff --exit-code -- brand/tokens/tokens.css web/src/app/tokens.css \
            || { echo "::error::tokens.css is stale — run brand/tokens/build_css.py and commit"; exit 1; }

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tailwind.config.ts REPLACES theme.spacing with the token scale, so an
      # off-scale utility produces no CSS rather than an off-grid value. That
      # failure is silent — a class that does nothing looks exactly like a class
      # that was never needed — so it is asserted here instead.
      - name: Spacing scale
        run: node scripts/check-spacing.mjs

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # The site is served from a subpath on GitHub Pages, which is where
      # static exports usually break — and the breakage is invisible in a
      # domain-root build. Building that way here means a bad base path fails
      # the pull request rather than the deployment.
      - name: Build with a base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /basepath-check
          NEXT_PUBLIC_SITE_URL: https://example.com/basepath-check

      - name: Assert the base path reached the output
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          grep -q 'href="/basepath-check/de/"' out/de/index.html \
            || fail "basePath missing from rendered links"
          grep -q 'href="/basepath-check/favicon.svg"' out/de/index.html \
            || fail "basePath missing from icon URLs"
          grep -q 'href="https://example.com/basepath-check/de/"' out/de/index.html \
            || fail "canonical URL is wrong"
          grep -q 'basepath-check/basepath-check' out/de/index.html \
            && fail "base path applied twice"
          echo "base path wiring verified"
