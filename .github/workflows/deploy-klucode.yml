name: Deploy KluCode site

# Publishes web/ to GitHub Pages.
#
# Pages serves a project repo from a subpath (https://<owner>.github.io/<repo>/),
# so the build is given NEXT_PUBLIC_BASE_PATH and NEXT_PUBLIC_SITE_URL rather
# than assuming a domain root. Both come from configure-pages, so this works
# unchanged if the repo is renamed or a custom domain is attached later.
#
# This is a PREVIEW deployment. The real site is a static export uploaded to
# Plesk — see web/README.md. Nothing here changes that path.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'brand/**'
      - '.github/workflows/deploy-klucode.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, but do not cancel one midway —
# a half-finished deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # enablement: true turns Pages on via the API if it is not already,
      # so this needs no manual click in repository settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Repeated at job level as well as workflow level. Inherited permissions
    # are enough in theory, but stating them here removes one variable when
    # the job is being rejected before it starts.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs before deploy-pages on purpose. If this line appears in the log,
      # the job was allowed to start and any failure belongs to the action. If
      # it does not, the github-pages environment rejected the job before it
      # ever ran — which produces no logs at all and is otherwise impossible to
      # tell apart from the action failing.
      - name: Confirm the job was allowed to start
        run: echo "deploy job started; environment gate passed"

      - id: deployment
        uses: actions/deploy-pages@v4
