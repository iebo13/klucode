name: Deploy KluCode site

# Publishes web/ to GitHub Pages.
#
# Pages serves a project repo from a subpath (https://<owner>.github.io/<repo>/),
# so the build is given NEXT_PUBLIC_BASE_PATH and NEXT_PUBLIC_SITE_URL rather
# than assuming a domain root. Both come from configure-pages, so this works
# unchanged if the repo is renamed or a custom domain is attached later.
#
# This is a PREVIEW deployment. The real site is a static export uploaded to
# Plesk — see web/README.md. Nothing here changes that path.

on:
  push:
    # master is here only to test one hypothesis: that the github-pages
    # environment carries a deployment branch policy naming a branch other
    # than main, which rejects the deploy job before it runs any step.
    # Remove it once the cause is known.
    branches: [main, master]
    paths:
      - 'web/**'
      - 'brand/**'
      - '.github/workflows/deploy-klucode.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, but do not cancel one midway —
# a half-finished deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # enablement: true turns Pages on via the API if it is not already,
      # so this needs no manual click in repository settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: JavaScript budget
        run: npm run check:bundle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  # This job depends on repository state that is not in this file: the
  # github-pages environment must allow main to deploy to it
  # (Settings -> Environments -> github-pages -> Deployment branches and tags
  # -> No restriction). A branch policy that excludes main kills this job in
  # about a second with zero steps executed and no log to read at all, which
  # looks nothing like a normal failure. If that ever recurs, check there
  # first rather than debugging the workflow.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
